name: probe-sdrplay
on:
  pull_request:
    paths: [.github/workflows/probe-sdrplay.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for v in 3.15.2 3.15.1 3.14.0 3.07.1; do
            for u in "https://www.sdrplay.com/software/SDRplay_RSP_API-Linux-$v.run" \
                     "https://www.sdrplay.com/software/SDRplayAPI-Linux-$v.run" \
                     "https://sdrplay.com/software/SDRplay_RSP_API-Linux-$v.run"; do
              echo "$(curl -sSIL -o /dev/null -w '%{http_code} %{url_effective} %{size_download}' "$u") <- $u"
            done
          done
          curl -sSL https://www.sdrplay.com/api-downloads/ | grep -oiE 'https?://[^"'"'"' ]*\.run' | sort -u | head
          curl -sSL https://www.sdrplay.com/downloads/ | grep -oiE '(href|src)="[^"]*\.run"' | sort -u | head
