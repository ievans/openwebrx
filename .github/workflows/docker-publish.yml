name: Publish Docker image

# The only way images are published. Nothing is pushed from a maintainer's
# machine: registry credentials live in GitHub (GITHUB_TOKEN for ghcr.io,
# repository secrets for the optional Docker Hub mirror), and every image
# carries signed build provenance (see "Verifying images" in README.md).

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  image:
    needs: tests
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
