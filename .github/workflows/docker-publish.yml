name: Publish Docker image

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      # Override with a repository variable DOCKERHUB_REPOSITORY (e.g. "myuser/openwebrx")
      IMAGE: ${{ vars.DOCKERHUB_REPOSITORY || format('{0}/openwebrx', secrets.DOCKERHUB_USERNAME) }}
    steps:
      - uses: actions/checkout@v4

      # SDRplay has no public download link. SDRPLAY_INSTALLER_URL (repository
      # secret) points at a copy you host; the Dockerfile checks its MD5 and
      # building with it accepts the SDRplay licence.
      - name: Fetch SDRplay API installer
        env:
          SDRPLAY_INSTALLER_URL: ${{ secrets.SDRPLAY_INSTALLER_URL }}
        run: |
          if [ -z "$SDRPLAY_INSTALLER_URL" ]; then
            echo "::error::secret SDRPLAY_INSTALLER_URL is not set"; exit 1
          fi
          curl -fsSL -o docker/vendor/SDRplay_RSP_API-Linux-3.15.2.run "$SDRPLAY_INSTALLER_URL"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: REQUIRE_SDRPLAY=1
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
